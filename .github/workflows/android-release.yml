
name: NexVora DocAI Direct APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare Direct APK
        run: |
          mkdir -p release-apk
          APK=$(find app/build/outputs/apk \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK file not found!"
            exit 1
          fi

          cp "$APK" release-apk/NexVora-DocAI.apk
          ls -lh release-apk/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: docai-${{ github.run_number }}
          name: NexVora DocAI Build ${{ github.run_number }}
          body: |
            NexVora DocAI Android APK
            Built automatically using GitHub Actions.
          files: release-apk/NexVora-DocAI.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

