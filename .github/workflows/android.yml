
name: NexVora DocAI - Android APK Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexvora-docai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build NexVora DocAI APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: 'yes'

      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Verify Project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-apk
          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" release-apk/NexVora-DocAI-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-DocAI-APK
          path: release-apk/NexVora-DocAI-debug.apk
          retention-days: 30

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-DocAI-Test-Reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        if: >
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: NexVora DocAI Build ${{ github.run_number }}
          body: |
            NexVora DocAI - Android APK

            Developer: Prince AR Abdur Rahman
            Publisher: NexVora Lab's Ofc

            Build: ${{ github.run_number }}
            Commit: ${{ github.sha }}

            Download APK from Release Assets.
          files: release-apk/NexVora-DocAI-debug.apk
          draft: false
          prerelease: false
          make_latest: true
          
